name: Verify nameless ruin rewards on MariaDB

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-nameless-ruin-rewards-mariadb.yml'
      - 'app/Services/NamelessRuinService.php'
      - 'app/Services/NamelessRuinExperienceCurve.php'
      - 'tests/Unit/NamelessRuinExperienceCurveTest.php'
      - 'tests/Unit/NamelessRuinDepthExperienceTest.php'
      - 'app/Services/NamelessBattleHistoryService.php'
      - 'app/Services/NamelessRuinCompensationService.php'
      - 'tests/Feature/NamelessRuinCompensationTest.php'
      - 'scripts/maintenance/compensate-nameless-ruins.php'
      - 'app/Livewire/CityHeader.php'
      - 'app/Services/Admin/SecurityLoginRetentionService.php'
      - 'app/Services/Admin/SecurityAnomalyDetectionService.php'
      - 'app/Services/SecurityLoginRetentionBusyException.php'
      - 'app/Console/Commands/DetectSecurityAnomalies.php'
      - 'tests/Feature/SecurityLoginRetentionTest.php'
      - 'tests/Feature/AdventurerCardAdventureRecordsCacheTest.php'
      - 'scripts/verify/security-retention-concurrency.php'
      - 'app/Services/MapExplorationRewardService.php'
      - 'app/Services/LevelService.php'
      - 'tests/Feature/NamelessRuinRewardsTest.php'
      - 'app/Services/WeeklyWinRankingService.php'
      - 'app/Services/TownRankingService.php'
      - 'tests/Feature/NamelessWeeklyWinsTest.php'
      - 'tests/Feature/WeeklyWinRankingTest.php'
      - 'tests/Feature/NamelessRuinDepthBossTest.php'
      - 'tests/Feature/NamelessRelicPrototypeTest.php'
      - 'tests/Support/NamelessRuinRewardReferences.php'

permissions:
  contents: read

concurrency:
  group: nameless-ruin-rewards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.5.13
        env:
          MARIADB_DATABASE: valzeria_nameless_ruin_rewards_ci
          MARIADB_USER: ruin_rewards_ci
          MARIADB_PASSWORD: ruin-rewards-ci-only
          MARIADB_ROOT_PASSWORD: ruin-rewards-root-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pruin-rewards-root-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: 'false'
      LOG_CHANNEL: stderr
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: valzeria_nameless_ruin_rewards_ci
      DB_USERNAME: ruin_rewards_ci
      DB_PASSWORD: ruin-rewards-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Verify ruin weekly wins and ranking regression sequentially
        shell: bash
        run: |
          set -euo pipefail
          test "$DB_DATABASE" = valzeria_nameless_ruin_rewards_ci
          mkdir -p reward-evidence
          php artisan config:clear --no-ansi
          for filter in \
            'test_real_single_boss_and_batch_wins_are_counted_once_on_replay$|test_actual_defeat_increments_losses_once_and_is_not_a_weekly_win$' \
            'test_saved_zero_exp_wins_and_partial_batch_use_original_week_even_when_off$|test_normal_and_ruin_scores_combine_with_ties_and_account_exclusions$' \
            'test_finalization_includes_ruin_wins_without_double_rewards$'; do
            count=$(( ${count:-0} + 1 ))
            php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --filter "$filter" --log-junit "reward-evidence/weekly-$count.xml" tests/Feature/NamelessWeeklyWinsTest.php
          done
          php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --filter 'test_unprepared_database_keeps_existing_normal_ranking$' --log-junit reward-evidence/weekly-unprepared.xml tests/Feature/NamelessWeeklyWinsTest.php
          for filter in \
            'test_live_weekly_rows_use_a_short_period_scoped_cache$|test_home_widget_serves_stale_data_until_the_scheduled_warmup_replaces_it$' \
            'test_guests_are_displayed_but_admins_and_testers_are_excluded$|test_non_combat_events_and_timeouts_saved_as_win_are_not_counted$'; do
            count=$(( ${count:-0} + 1 ))
            php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --filter "$filter" --log-junit "reward-evidence/ranking-$count.xml" tests/Feature/WeeklyWinRankingTest.php
          done
      - name: Verify reward cases sequentially in small batches
        shell: bash
        run: |
          set -euo pipefail
          test "$DB_DATABASE" = valzeria_nameless_ruin_rewards_ci
          mkdir -p reward-evidence
          php artisan config:clear --no-ansi
          for filter in \
            'test_normal_victory_persists_reference_rewards_and_replay_does_not_pay_twice$|test_repeated_exploration_totals_match_stored_growth_and_gold_ledger$' \
            'test_boss_rewards_and_depth_progress_commit_once$|test_defeat_has_no_growth_or_gold_or_relic_reward$' \
            'test_failed_gold_write_rolls_back_stamina_growth_and_progress$|test_gold_remains_a_chance_drop_while_experience_is_paid$' \
            'test_level_up_is_saved_and_returned_without_healing_current_hp$|test_maximum_level_preserves_cap_and_still_awards_gold_and_job_exp$' \
            'test_default_job_reward_uses_reference_level_instead_of_ruin_depth$'; do
            count=$(( ${count:-0} + 1 ))
            php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --filter "$filter" --log-junit "reward-evidence/rewards-$count.xml" tests/Feature/NamelessRuinRewardsTest.php
          done
          php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --log-junit reward-evidence/map.xml tests/Feature/MapExplorationRewardServiceTest.php
          php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --filter 'test_actual_ruin_boss_battle_awards_once_advances_only_its_zone_and_consumes_stamina$|test_fifty_ruin_battles_aggregate_relics_and_replay_without_extra_consumption$' --log-junit reward-evidence/prototype.xml tests/Feature/NamelessRelicPrototypeTest.php
          php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --filter 'test_actual_ruin_defeat_has_no_drop_or_progress_and_persists_standard_defeat_resources$|test_boss_reappears_only_at_cleared_depth_without_unlocking_or_extra_stamina_cost$' --log-junit reward-evidence/ruin-encounters.xml tests/Feature/NamelessRelicPrototypeTest.php
          php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --filter 'test_every_boss_can_be_fought_and_replayed_without_changing_reward_or_progress_rules$' --log-junit reward-evidence/boss.xml tests/Feature/NamelessRuinDepthBossTest.php
      - name: Verify preserved depth experience changes sequentially
        shell: bash
        run: |
          set -euo pipefail
          php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --log-junit reward-evidence/depth-curve-unit.xml tests/Unit/NamelessRuinExperienceCurveTest.php tests/Unit/NamelessRuinDepthExperienceTest.php
          php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --filter 'test_deep_repeated_victories_increase_only_experience_and_replay_once$|test_deep_boss_challenge_and_reencounter_use_the_same_experience$' --log-junit reward-evidence/depth-battle.xml tests/Feature/NamelessRuinRewardsTest.php
          php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --filter 'test_deep_goblin_uses_the_depth_curve_and_preserves_job_experience$' --log-junit reward-evidence/depth-goblin.xml tests/Feature/NamelessRuinRewardsTest.php
      - name: Verify historical compensation sequentially
        shell: bash
        run: |
          set -euo pipefail
          for filter in \
            'test_plan_is_readonly_and_fixed_batch_rewards_replay_without_duplicate_history$|test_level_growth_preserves_hp_and_pays_the_current_job$|test_reward_reference_is_loaded_once_for_multiple_source_operations$|test_legacy_compensation_preserves_approved_reference_after_new_depth_curve_release$' \
            'test_capped_level_and_mastered_job_keep_caps_but_receive_gold_and_wins$|test_failed_gold_ledger_rolls_back_all_growth_and_can_retry_the_fixed_plan$' \
            'test_changed_source_and_changed_receipt_payload_are_rejected$|test_counter_only_history_does_not_pay_existing_rewards_again$|test_active_map_defers_repair_without_creating_a_receipt$|test_fallback_job_reward_uses_reference_level_and_fixed_draws_with_no_gold$' \
            'test_verified_switch_window_old_single_is_compensated_and_new_single_is_rejected$|test_reward_switch_window_zero_reward_is_paid_and_ambiguous_counter_batch_is_rejected$'; do
            count=$(( ${count:-0} + 1 ))
            php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --filter "$filter" --log-junit "reward-evidence/compensation-$count.xml" tests/Feature/NamelessRuinCompensationTest.php
          done
      - name: Verify card and security retention regressions sequentially
        shell: bash
        run: |
          set -euo pipefail
          test "$DB_DATABASE" = valzeria_nameless_ruin_rewards_ci
          php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --log-junit reward-evidence/card.xml tests/Feature/AdventurerCardAdventureRecordsCacheTest.php
          php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --log-junit reward-evidence/retention.xml tests/Feature/SecurityLoginRetentionTest.php
          php -d memory_limit=128M vendor/phpunit/phpunit/phpunit --filter 'test_scan_detects_rapid_battles_and_unexpected_job_exp_without_duplicate_cases$|test_scan_detects_abnormal_gold_and_shared_ip_without_storing_plain_ip$|test_busy_character_keeps_baseline_while_other_characters_are_scanned_and_next_scan_catches_growth$' --log-junit reward-evidence/security.xml tests/Feature/AdminSecurityAnomalyDetectionTest.php
          printf '{}' > reward-evidence/rejected-plan.json
          set +e
          php -d memory_limit=128M scripts/maintenance/compensate-nameless-ruins.php --preview reward-evidence/rejected-plan.json --sha256 invalid > reward-evidence/rejected-plan.out 2> reward-evidence/rejected-plan.err
          rejected_plan_status=$?
          APP_ENV=local php -d memory_limit=128M scripts/verify/security-retention-concurrency.php > reward-evidence/rejected-environment.out 2> reward-evidence/rejected-environment.err
          rejected_environment_status=$?
          set -e
          test "$rejected_plan_status" -eq 1
          test "$rejected_environment_status" -eq 1
          php -d memory_limit=128M scripts/verify/security-retention-concurrency.php > reward-evidence/retention-concurrency.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nameless-ruin-reward-evidence
          path: reward-evidence
          retention-days: 7
          if-no-files-found: ignore
